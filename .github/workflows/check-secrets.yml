name: Check secrets

# Tests every secret against its real service; prints only OK/FAIL, never values.
# Each secret is its own step, so the step list shows exactly which one is wrong.
on:
  schedule:
    - cron: "30 3 * * 1"   # Mondays 09:00 IST: weekly health check (catches expired tokens)
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-secrets.yml"
      - "scripts/check_secrets.py"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_BOT_ID: "8615984325"          # @codeXoneByHiteshBot (not secret)
      EXPECTED_IG_ID: "17841475010536333"    # @codexonebyhitesh (not secret)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install python-dotenv PyYAML requests pydantic python-telegram-bot google-genai cloudinary google-api-python-client google-auth sqlalchemy psycopg[binary]

      - name: DATABASE_URL
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/check_secrets.py database

      - name: TG_BOT_TOKEN + TG_CHAT_ID
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scripts/check_secrets.py telegram

      - name: GEMINI_API_KEY
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/check_secrets.py gemini

      - name: CLOUDINARY_URL
        if: always()
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: python scripts/check_secrets.py cloudinary

      - name: IG_ACCESS_TOKEN + IG_USER_ID
        if: always()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/check_secrets.py instagram

      - name: YT_CLIENT_ID
        if: always()
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          EXPECTED_FP_YT_CLIENT_ID: "b3384ed3"   # sha256 prefix of the working local value (not secret)
        run: python scripts/check_secrets.py yt_client_id

      - name: YT_CLIENT_SECRET
        if: always()
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          EXPECTED_FP_YT_CLIENT_SECRET: "fe389eb4"   # sha256 prefix of the working local value (not secret)
        run: python scripts/check_secrets.py yt_client_secret

      - name: YT_REFRESH_TOKEN
        if: always()
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          EXPECTED_FP_YT_REFRESH_TOKEN: "a77bfa6d"   # sha256 prefix of the working local value (not secret)
        run: python scripts/check_secrets.py yt_refresh_token

      - name: YouTube token refresh (all three together)
        if: always()
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
        run: python scripts/check_secrets.py youtube

      - name: GH_PAT
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/check_secrets.py gh_pat

      - name: Alert on Telegram if anything failed
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage"             --data-urlencode "chat_id=${TG_CHAT_ID}"             --data-urlencode "text=⚠️ Secrets check failed — a token may have expired. Failing steps are marked ❌ here: ${RUN_URL}"
