name: Check secrets

# Tests every secret against its real service; prints only OK/FAIL, never values.
# Each secret is its own step, so the step list shows exactly which one is wrong.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-secrets.yml"
      - "scripts/check_secrets.py"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_BOT_ID: "8615984325"          # @codeXoneByHiteshBot (not secret)
      EXPECTED_IG_ID: "17841475010536333"    # @codexonebyhitesh (not secret)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install python-dotenv PyYAML requests pydantic python-telegram-bot google-genai cloudinary

      - name: TG_BOT_TOKEN + TG_CHAT_ID
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scripts/check_secrets.py telegram

      - name: GEMINI_API_KEY
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/check_secrets.py gemini

      - name: CLOUDINARY_URL
        if: always()
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: python scripts/check_secrets.py cloudinary

      - name: IG_ACCESS_TOKEN + IG_USER_ID
        if: always()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/check_secrets.py instagram

      - name: GH_PAT
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/check_secrets.py gh_pat
