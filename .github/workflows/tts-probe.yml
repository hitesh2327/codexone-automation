# TEMPORARY (Hinglish narration step 0, docs/specs/hinglish-narration-plan.md): probe the Hindi
# edge-tts voices from a GitHub runner. Delete once the results are in the plan.
name: TTS probe (temporary)
on:
  push:
    branches: [claude/beautiful-thompson-prz5bb]
    paths: [scripts/tts_probe.py, .github/workflows/tts-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "edge-tts>=7" imageio-ffmpeg
      - run: python scripts/tts_probe.py --out tts_probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tts-probe
          path: tts_probe/
