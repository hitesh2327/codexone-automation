name: Weekly Instagram token refresh

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 08:30 IST
  workflow_dispatch:

concurrency:
  group: queue-state
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install python-dotenv PyYAML requests pydantic
      - name: Refresh token and update the IG_ACCESS_TOKEN secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -m src.refresh_token
