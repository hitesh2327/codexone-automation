<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0D1117; --cyan: #00E5FF; --amber: #FFB800; --text: #FFFFFF;
    --blue: #3B82F6; --blue-hi: #7DB3FF; --green: #22C55E; --green-hi: #7CF0A6; --red: #FF4D5E;
    --muted: #8B949E; --line: rgba(255,255,255,.10); --panel: rgba(255,255,255,.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 700px at 100% 0%, rgba(0,229,255,.10), transparent 60%),
      radial-gradient(800px 700px at 0% 70%, rgba(59,130,246,.08), transparent 60%),
      var(--bg);
    color: var(--text); font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.07) 1.5px, transparent 1.5px);
    background-size: 40px 40px;
    mask-image: linear-gradient(180deg, transparent 0%, #000 20%, #000 75%, transparent 100%);
  }
  .abs { position: absolute; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* top bar */
  #progress { left: 0; top: 0; height: 8px; background: linear-gradient(90deg, var(--blue), var(--green)); }
  #handle { left: 70px; top: 92px; font: 600 30px Poppins; display: flex; align-items: center; gap: 16px; }
  #handle .logo { width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--cyan), #6FD3B0); color: var(--bg); font: 700 22px 'JetBrains Mono'; }
  #timer { right: 70px; top: 94px; font: 700 36px 'JetBrains Mono'; padding: 6px 22px; border-radius: 40px;
    border: 2px solid var(--line); background: var(--panel); }

  /* title */
  #title { left: 0; width: 1080px; top: 186px; text-align: center; font-family: Poppins; }
  #title .l1 { font-weight: 800; font-size: 108px; line-height: 1; letter-spacing: -2px; }
  #title .l1 .b { color: var(--blue-hi); text-shadow: 0 0 40px rgba(59,130,246,.6); }
  #title .l1 .g { color: var(--green-hi); text-shadow: 0 0 40px rgba(34,197,94,.55); }
  #title .l2 { font-weight: 600; font-size: 52px; color: #E6EDF3; margin-top: 8px; letter-spacing: 1px; }

  /* beat heading */
  #heading { left: 0; width: 1080px; top: 398px; text-align: center; }
  #heading span { display: inline-block; font: 700 40px 'JetBrains Mono'; letter-spacing: 6px; padding: 10px 30px;
    border-radius: 12px; border: 2px solid currentColor; background: color-mix(in srgb, currentColor 12%, transparent); }

  /* nodes */
  .node { border: 2px solid var(--line); background: rgba(22,27,34,.92); border-radius: 22px; }
  #users { left: 340px; top: 512px; width: 400px; height: 96px; display: flex; align-items: center; justify-content: center; gap: 18px;
    font: 700 30px 'JetBrains Mono'; letter-spacing: 3px; }
  #users .faces { display: flex; }
  #users .faces i { width: 34px; height: 34px; border-radius: 50%; margin-left: -10px; border: 3px solid #161B22;
    background: linear-gradient(135deg, #9AA4AF, #5A636D); }
  #users small { font: 500 22px 'JetBrains Mono'; color: var(--muted); letter-spacing: 0; }
  #router { left: 466px; top: 686px; width: 148px; height: 148px; border-radius: 50%; display: grid; place-items: center; }
  #router .lbl { position: absolute; top: 58px; width: 200px; left: -224px; text-align: right; font: 700 22px 'JetBrains Mono'; letter-spacing: 4px; color: var(--muted); }
  #needle { position: absolute; left: 72px; top: 30px; width: 4px; height: 44px; border-radius: 4px; transform-origin: 2px 44px; }
  #router .hub { width: 26px; height: 26px; border-radius: 50%; background: #E6EDF3; position: relative; top: 2px; }
  #qa { left: 852px; top: 720px; width: 168px; height: 80px; display: flex; align-items: center; justify-content: center; gap: 10px;
    font: 700 26px 'JetBrains Mono'; color: var(--amber); border-color: rgba(255,184,0,.5); }

  .env { top: 960px; width: 450px; height: 290px; border-radius: 26px; border: 2px solid var(--line); background: rgba(22,27,34,.85); }
  #envB { left: 70px; } #envG { left: 560px; }
  .env .hdr { position: absolute; left: 24px; right: 24px; top: 16px; display: flex; justify-content: space-between; align-items: center; }
  .env .name { font: 800 30px Poppins; }
  .env .badge { font: 700 19px 'JetBrains Mono'; letter-spacing: 2px; padding: 5px 14px; border-radius: 20px; border: 2px solid currentColor; }
  .tile { position: absolute; top: 76px; width: 122px; height: 192px; border-radius: 16px; border: 2px solid var(--line);
    background: rgba(255,255,255,.03); display: flex; flex-direction: column; align-items: center; padding-top: 18px; gap: 10px; }
  .tile .ico { width: 70px; height: 70px; display: grid; place-items: center; position: relative; }
  .tile .nm { font: 600 19px 'JetBrains Mono'; color: var(--muted); }
  .tile .bar { width: 82px; height: 10px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; }
  .tile .bar i { display: block; height: 100%; border-radius: 6px; }
  .tile .st { font: 700 17px 'JetBrains Mono'; letter-spacing: 1px; height: 22px; }

  /* counters */
  #stats { left: 70px; top: 1290px; width: 940px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
  .stat { border: 2px solid var(--line); background: var(--panel); border-radius: 18px; padding: 16px 22px; height: 118px; }
  .stat .k { font: 600 19px 'JetBrains Mono'; letter-spacing: 2px; color: var(--muted); }
  .stat .v { font: 700 40px 'JetBrains Mono'; margin-top: 8px; white-space: nowrap; }

  #term { left: 70px; top: 1432px; width: 940px; height: 84px; border-radius: 16px; background: #0A0D12; border: 2px solid var(--line);
    display: flex; align-items: center; padding: 0 26px; font: 500 30px 'JetBrains Mono'; white-space: pre; overflow: hidden; }
  #term .p { color: var(--green); } #term .cur { display: inline-block; width: 15px; height: 32px; background: #E6EDF3; margin-left: 2px; vertical-align: -5px; }

  #caption { left: 90px; width: 900px; top: 1556px; text-align: center; font: 700 46px Poppins; line-height: 1.2; }
  #caption em { font-style: normal; color: var(--amber); }

  /* payoff */
  #payoff { left: 70px; top: 500px; width: 940px; height: 770px; border-radius: 34px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 18px;
    background: rgba(13,17,23,.84); border: 2px solid rgba(124,240,166,.35); backdrop-filter: blur(10px); }
  #payoff .big { font: 800 92px Poppins; line-height: 1.02; letter-spacing: -1px; }
  #payoff .sub { font: 600 30px 'JetBrains Mono'; color: #C9D1D9; margin-top: 18px; }
  #payoff .follow { margin-top: 30px; font: 700 30px 'JetBrains Mono'; color: var(--bg); background: var(--cyan); padding: 14px 30px; border-radius: 16px; }
</style>
</head>
<body>
<div id="progress" class="abs"></div>
<div id="handle" class="abs"><div class="logo">&lt;/&gt;</div>@codexonebyhitesh</div>
<div id="timer" class="abs">0:00</div>

<div id="title" class="abs">
  <div class="l1"><span class="b">Blue</span>-<span class="g">Green</span></div>
  <div class="l2">Deployment</div>
</div>
<div id="heading" class="abs"><span></span></div>

<svg id="wires" class="abs" style="left:0;top:0" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g id="wireG"></g>
  <g id="dotG" filter="url(#glow)"></g>
</svg>

<div id="users" class="abs node"><div class="faces"><i></i><i></i><i></i><i></i></div>USERS <small id="rps"></small></div>
<div id="router" class="abs node"><div id="needle"></div><div class="hub"></div><div class="lbl">ROUTER</div></div>
<div id="qa" class="abs node">⚙ QA</div>

<div id="envB" class="abs env"><div class="hdr"><div class="name" style="color:var(--blue-hi)">BLUE <span class="mono" style="font-size:22px;color:var(--muted)">v1.0</span></div><div class="badge"></div></div></div>
<div id="envG" class="abs env"><div class="hdr"><div class="name" style="color:var(--green-hi)">GREEN <span class="mono ver" style="font-size:22px;color:var(--muted)"></span></div><div class="badge"></div></div></div>

<div id="stats" class="abs">
  <div class="stat"><div class="k">LIVE</div><div class="v" id="sLive"></div></div>
  <div class="stat"><div class="k">REQUESTS</div><div class="v" id="sReq"></div></div>
  <div class="stat"><div class="k">DOWNTIME</div><div class="v" id="sDown" style="color:var(--green-hi)">0.0s</div></div>
</div>
<div id="term" class="abs"></div>
<div id="caption" class="abs"></div>

<div id="payoff" class="abs">
  <div class="big" style="color:var(--green-hi)">Zero downtime.</div>
  <div class="big" style="color:var(--blue-hi)">Instant rollback.</div>
  <div class="sub">1 switch · 0s down · rollback in 1s</div>
  <div class="follow">Follow @codexonebyhitesh</div>
</div>

<script>
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const C = { blue: '#3B82F6', blueHi: '#7DB3FF', green: '#22C55E', greenHi: '#7CF0A6', red: '#FF4D5E', amber: '#FFB800', cyan: '#00E5FF', muted: '#8B949E' };

// ---- geometry -----------------------------------------------------------
const ROUTER = { x: 540, y: 760 };
const TILE_X = { B: [155, 295, 435], G: [645, 785, 925] };
const ENV_TOP = 960, TILE_TOP = 1036;
const paths = {};
function mkPath(id, d, extra = {}) {
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke-linecap', 'round');
  for (const k in extra) p.setAttribute(k, extra[k]);
  $('#wireG').appendChild(p);
  paths[id] = { el: p, len: p.getTotalLength() };
  return p;
}
mkPath('in', `M540 608 L540 686`);
for (const env of ['B', 'G']) TILE_X[env].forEach((x, i) =>
  mkPath(env + i, `M540 834 C540 900, ${x} 880, ${x} ${ENV_TOP}`));
TILE_X.G.forEach((x, i) => mkPath('qa' + i, `M936 800 C936 860, ${x} 880, ${x} ${ENV_TOP}`));
const at = (id, f) => paths[id].el.getPointAtLength(paths[id].len * clamp(f));

// tiles
const tiles = {};
for (const env of ['B', 'G']) {
  tiles[env] = [0, 1, 2].map(i => {
    const d = document.createElement('div');
    d.className = 'tile';
    d.style.left = (TILE_X[env][i] - (env === 'B' ? 70 : 560) - 61) + 'px';
    d.innerHTML = `<div class="ico"></div><div class="nm">srv-${i + 1}</div><div class="bar"><i></i></div><div class="st"></div>`;
    $(env === 'B' ? '#envB' : '#envG').appendChild(d);
    return d;
  });
}
const serverSvg = (col) => `<svg width="64" height="64" viewBox="0 0 64 64"><g fill="none" stroke="${col}" stroke-width="4">
  <rect x="8" y="8" width="48" height="20" rx="5"/><rect x="8" y="36" width="48" height="20" rx="5"/></g>
  <circle cx="18" cy="18" r="3.5" fill="${col}"/><circle cx="18" cy="46" r="3.5" fill="${col}"/></svg>`;
const spinSvg = (a) => `<svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="6"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="${C.amber}" stroke-width="6" stroke-linecap="round" stroke-dasharray="40 200" transform="rotate(${a} 32 32)"/></svg>`;
const xSvg = `<svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="rgba(255,77,94,.15)" stroke="${C.red}" stroke-width="4"/>
  <path d="M22 22 L42 42 M42 22 L22 42" stroke="${C.red}" stroke-width="6" stroke-linecap="round"/></svg>`;

// dot pool
const DOTS = 90, dotEls = [];
for (let i = 0; i < DOTS; i++) { const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 8); $('#dotG').appendChild(c); dotEls.push(c); }

// ---- timeline ------------------------------------------------------------
let TL = null;          // {total, beats:[{start,end,heading,color,term,caption}], ev:{...}}
function setTimeline(tl) { TL = tl; }
const beatAt = t => { let k = 0; TL.beats.forEach((b, i) => { if (t >= b.start) k = i; }); return k; };
const hash = k => { const x = Math.sin(k * 127.1) * 43758.5453; return x - Math.floor(x); };

// which env the router sends traffic to at time t (+ needle angle)
function liveAt(t) { const e = TL.ev; return (t >= e.switch && t < e.rollback) ? 'G' : 'B'; }
function needleAngle(t) {
  const e = TL.ev, A = -38, B = 38;
  let a = A;
  a += (B - A) * ease((t - e.switch) / .35);
  a += (A - B) * ease((t - e.rollback) / .35);
  return a;
}
// green env lifecycle
function greenState(t, i) {
  const e = TL.ev;
  const boot = e.boot + i * .55, ready = boot + 1.1;
  if (t < boot) return 'empty';
  if (t < ready) return 'boot';
  if (t >= e.bug && t < e.rollback + .9 && i === 1) return 'error';
  if (t >= e.test + .5 + i * .45 && t < e.switch) return 'tested';
  return 'ok';
}

const INTERVAL = .085, LEG1 = .32, LEG2 = .7, LEG3 = .22;
function dotRoute(k) {
  const born = k * INTERVAL - 1.6, atRouter = born + LEG1;
  const env = liveAt(atRouter), tile = Math.floor(hash(k) * 3);
  const bad = env === 'G' && tile === 1 && atRouter >= TL.ev.bug && atRouter < TL.ev.rollback;
  return { born, env, tile, bad };
}

function renderAt(t) {
  const e = TL.ev, b = TL.beats[beatAt(t)], bi = beatAt(t), bStart = b.start;
  const total = TL.total;

  $('#progress').style.width = (1080 * clamp(t / total)) + 'px';
  $('#timer').textContent = '0:' + String(Math.max(0, Math.ceil(total - t))).padStart(2, '0');

  // heading (slide/fade on beat change)
  const hp = easeOut((t - bStart) / .3);
  const h = $('#heading span');
  h.textContent = b.heading; h.style.color = b.color;
  h.style.opacity = hp; h.style.transform = `translateY(${(1 - hp) * 18}px) scale(${.96 + .04 * hp})`;

  // router needle
  const live = liveAt(t);
  const nCol = live === 'G' ? C.greenHi : C.blueHi;
  $('#needle').style.transform = `rotate(${needleAngle(t)}deg)`;
  $('#needle').style.background = nCol;
  $('#router').style.borderColor = nCol;
  $('#router').style.boxShadow = `0 0 ${30 + 10 * Math.sin(t * 6)}px ${live === 'G' ? 'rgba(34,197,94,.45)' : 'rgba(59,130,246,.45)'}`;
  const sw = Math.max(0, 1 - Math.abs(t - e.switch) / .4) + Math.max(0, 1 - Math.abs(t - e.rollback) / .4);
  $('#router').style.transform = `scale(${1 + .12 * sw})`;
  $('#rps').textContent = (1180 + Math.round(60 * Math.sin(t * 1.7))) + ' req/s';

  // QA probe visible during test beat
  const qaOn = clamp((t - e.test + .2) / .3) * (1 - clamp((t - e.switch + .3) / .3));
  $('#qa').style.opacity = qaOn;

  // wires
  for (const env of ['B', 'G']) for (let i = 0; i < 3; i++) {
    const p = paths[env + i].el, on = live === env && !(env === 'G' && greenState(t, i) === 'empty');
    const col = env === 'B' ? C.blue : C.green;
    p.setAttribute('stroke', on ? col : 'rgba(255,255,255,.10)');
    p.setAttribute('stroke-width', on ? 5 : 3);
    p.setAttribute('stroke-opacity', on ? .75 : 1);
    p.setAttribute('stroke-dasharray', env === 'G' && greenState(t, i) === 'empty' ? '6 12' : 'none');
  }
  paths.in.el.setAttribute('stroke', 'rgba(255,255,255,.35)'); paths.in.el.setAttribute('stroke-width', 5);
  for (let i = 0; i < 3; i++) {
    const p = paths['qa' + i].el;
    p.setAttribute('stroke', C.amber); p.setAttribute('stroke-width', 3);
    p.setAttribute('stroke-dasharray', '8 10'); p.setAttribute('stroke-opacity', .55 * qaOn);
  }

  // dots: user traffic
  let n = 0, served = 0, errors = 0;
  const kMax = Math.floor((t + 1.6) / INTERVAL);
  for (let k = 0; k <= kMax; k++) {
    const r = dotRoute(k), age = t - r.born;
    if (age >= LEG1 + LEG2 + LEG3) { served++; if (r.bad) errors++; continue; }
    if (age < 0 || n >= DOTS) continue;
    let pt, op = 1;
    if (age < LEG1) pt = at('in', age / LEG1);
    else if (age < LEG1 + LEG2) pt = at(r.env + r.tile, ease((age - LEG1) / LEG2));
    else { const f = (age - LEG1 - LEG2) / LEG3; const x = TILE_X[r.env][r.tile]; pt = { x, y: ENV_TOP + f * 60 }; op = 1 - f; }
    let col = r.env === 'B' ? C.blueHi : C.greenHi;
    if (r.bad && age > LEG1 + LEG2 * .6) col = C.red;
    const c = dotEls[n++];
    c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y); c.setAttribute('fill', col); c.setAttribute('opacity', op);
    c.setAttribute('r', age < LEG1 ? 7 : 8);
  }
  // dots: QA test traffic into green
  if (qaOn > 0) for (let k = 0; k < 9 && n < DOTS; k++) {
    const f = ((t * 1.1 + k / 9) % 1);
    const c = dotEls[n++], pt = at('qa' + (k % 3), f);
    c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y); c.setAttribute('fill', C.amber); c.setAttribute('opacity', qaOn); c.setAttribute('r', 6);
  }
  for (; n < DOTS; n++) dotEls[n].setAttribute('opacity', 0);

  // environments
  for (const env of ['B', 'G']) {
    const box = $(env === 'B' ? '#envB' : '#envG'), isLive = live === env;
    const col = env === 'B' ? C.blue : C.green;
    const gEmpty = env === 'G' && t < e.boot;
    box.style.borderColor = isLive ? col : 'rgba(255,255,255,.10)';
    box.style.boxShadow = isLive ? `0 0 50px ${env === 'B' ? 'rgba(59,130,246,.30)' : 'rgba(34,197,94,.30)'}` : 'none';
    box.style.opacity = gEmpty ? .45 : 1;
    const badge = box.querySelector('.badge');
    let bt = 'STANDBY', bc = C.muted;
    if (isLive) { bt = '● LIVE'; bc = env === 'B' ? C.blueHi : C.greenHi; }
    else if (env === 'G') {
      if (gEmpty) bt = 'EMPTY';
      else if (t < e.boot + 2.2) { bt = 'BOOTING'; bc = C.amber; }
      else if (t < e.switch) { bt = 'TESTING'; bc = C.amber; }
    }
    badge.textContent = bt; badge.style.color = bc;
    if (env === 'G') box.querySelector('.ver').textContent = gEmpty ? '' : 'v2.0';

    tiles[env].forEach((tile, i) => {
      const st = env === 'B' ? 'ok' : greenState(t, i);
      const ico = tile.querySelector('.ico'), bar = tile.querySelector('.bar i'), s = tile.querySelector('.st');
      const load = isLive ? .55 + .3 * Math.sin(t * 3.1 + i * 2) : .08;
      tile.style.transform = 'none';
      if (st === 'empty') {
        tile.style.borderStyle = 'dashed'; tile.style.borderColor = 'rgba(255,255,255,.12)';
        ico.innerHTML = ''; bar.style.width = '0'; s.textContent = ''; return;
      }
      tile.style.borderStyle = 'solid';
      if (st === 'boot') {
        tile.style.borderColor = 'rgba(255,184,0,.5)';
        ico.innerHTML = spinSvg(t * 420); bar.style.width = '0'; s.textContent = 'boot'; s.style.color = C.amber; return;
      }
      if (st === 'error') {
        tile.style.borderColor = C.red; tile.style.transform = `translateX(${4 * Math.sin(t * 55)}px)`;
        ico.innerHTML = xSvg; bar.style.width = '0'; s.textContent = 'HTTP 500'; s.style.color = C.red; return;
      }
      const hi = env === 'B' ? C.blueHi : C.greenHi;
      tile.style.borderColor = isLive ? col : 'rgba(255,255,255,.14)';
      ico.innerHTML = serverSvg(isLive ? hi : '#6E7681');
      bar.style.width = (load * 100) + '%'; bar.style.background = hi;
      if (st === 'tested') { s.textContent = '✓ 200'; s.style.color = C.greenHi; }
      else { s.textContent = isLive ? `${Math.round(load * 100)}%` : 'idle'; s.style.color = isLive ? hi : C.muted; }
    });
  }

  // stats
  const sLive = $('#sLive');
  sLive.textContent = live === 'G' ? 'GREEN v2' : 'BLUE v1';
  sLive.style.color = live === 'G' ? C.greenHi : C.blueHi;
  $('#sReq').textContent = (48200 + served * 37).toLocaleString('en-US');
  const flash = Math.max(0, 1 - Math.abs(t - e.switch - .2) / .6) + Math.max(0, 1 - Math.abs(t - e.rollback - .2) / .6);
  $('#sDown').parentElement.style.borderColor = flash > 0 ? `rgba(124,240,166,${.2 + .8 * clamp(flash)})` : 'rgba(255,255,255,.10)';

  // terminal: type the beat's command
  const typed = Math.floor(clamp((t - bStart - .1) * 32, 0, 999));
  const cmd = b.term.slice(0, typed);
  const blink = Math.floor(t * 2.5) % 2 === 0 || typed < b.term.length;
  $('#term').innerHTML = `<span class="p">$ </span>${cmd.replace(/</g, '&lt;')}${blink ? '<span class="cur"></span>' : ''}`;

  // caption
  const cp = easeOut((t - bStart - .05) / .3);
  const cap = $('#caption');
  cap.innerHTML = b.caption; cap.style.opacity = cp; cap.style.transform = `translateY(${(1 - cp) * 20}px)`;

  // payoff
  const pp = easeOut((t - e.payoff) / .45);
  const po = $('#payoff');
  po.style.opacity = pp; po.style.transform = `scale(${.9 + .1 * pp})`;
  $('#heading').style.opacity = 1;
}
window.setTimeline = setTimeline; window.renderAt = renderAt;
</script>
</body>
