handle: "@codexonebyhitesh"
colors:
  { bg: "#0D1117", primary: "#00E5FF", accent: "#FFB800", text: "#FFFFFF" }
fonts: { heading: "Poppins", body: "Inter", code: "JetBrains Mono" }
# How words should be SPOKEN in reels (applied to narration before text-to-speech;
# matching is case-insensitive and ignores a leading @).
pronunciations:
  codexonebyhitesh: "Code Xone By Hitesh"

# Reel narration language for every run: "hi" Hinglish (Hindi voice, no subtitles) or "en" English.
# The Generate page can switch one run to the other.
narration_language: "en"

# Hinglish reels rotate through these voices round-robin (one per reel, in order).
# Naming one in Telegram feedback before Regenerate ("use Madhur", "use Swara") picks it instead.
voices_hi:
  - hi-IN-MadhurNeural               # Madhur: natural Hindi male
  - hi-IN-SwaraNeural                # Swara: clear Hindi female
# English reels (Generate page > Narration: English) rotate through these ("use Andrew" picks one).
voices:
  - en-US-AndrewMultilingualNeural   # 1 Andrew: warm, confident
  - en-US-BrianMultilingualNeural    # 2 Brian: casual, friendly
  - en-US-ChristopherNeural          # 3 Christopher: authoritative
  - en-US-GuyNeural                  # 4 Guy: energetic
  - en-GB-RyanNeural                 # 5 Ryan: British
  - en-US-AvaMultilingualNeural      # 7 Ava: expressive
  - en-US-EmmaMultilingualNeural     # 8 Emma: cheerful, clear
# Written text (topics, carousel, on-screen text, caption) stays English; narration_language sets the voice.
language: "English, simple, beginner-friendly"
topics_weight:
  { AI: 30, SystemDesign: 20, DSA: 20, Interview: 15, OS: 10, Dev: 5 }
posts_per_day: 2
# One post (reel + carousel) per slot. Generation runs ~1-2h before each slot
# (see .github/workflows/daily-generate.yml); approved items publish at their slot.
post_times_ist: ["10:00", "19:00"]
reel:
  size: "1080x1920"
  duration_sec: "18-24"
  structure: "hook, problem, architecture shift, loop bridge"   # 18-24s high retention
  # Top outlier formulas in tech engineering (ig-viral / ig-audit)
  preferred_hook_formulas:
    - "Negative Command"
    - "Nobody Tells You"
    - "The Trap"
    - "Counter-Intuitive"
    - "The Test"
carousel: { size: "1080x1350", slides: "5-7" }
cta: "Comment 'SCALE' to get the full architecture cheat sheet + code in your DMs"
hashtags:
  [
    "#systemdesign",
    "#softwareengineering",
    "#backend",
    "#codingtips",
    "#devcommunity",
  ]

