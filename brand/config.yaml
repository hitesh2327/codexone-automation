handle: "@codexonebyhitesh"
colors:
  { bg: "#0D1117", primary: "#00E5FF", accent: "#FFB800", text: "#FFFFFF" }
fonts: { heading: "Poppins", body: "Inter", code: "JetBrains Mono" }
# How words should be SPOKEN in reels (applied to narration before text-to-speech;
# matching is case-insensitive and ignores a leading @).
pronunciations:
  codexonebyhitesh: "Code Xone By Hitesh"

# Reels rotate through these voices round-robin (one per reel, in order).
# Naming one in Telegram feedback before Regenerate (e.g. "use Madhur" or "use Swara") picks it instead.
voices:
  - hi-IN-MadhurNeural   # Madhur: Natural Hindi male
  - hi-IN-SwaraNeural    # Swara: Clear Hindi female
language: "Hindi, simple, beginner-friendly"
topics_weight:
  { AI: 30, SystemDesign: 20, DSA: 20, Interview: 15, OS: 10, Dev: 5 }
posts_per_day: 2
# One post (reel + carousel) per slot. Generation runs ~1-2h before each slot
# (see .github/workflows/daily-generate.yml); approved items publish at their slot.
post_times_ist: ["10:00", "19:00"]
reel:
  size: "1080x1920"
  duration_sec: "20-30"
  structure: "hook, 3 points, CTA"   # hard max 30s
  # Every category uses the animated-diagram engine (src/reel_v2). List a category here to
  # switch it back to the classic text + demo reel and slides.
  classic_categories: []
  # Updated monthly after running `python scripts/run_swipe.py` (ig-viral skill).
  # These formula names appear most in the top-third outlier reels in this niche.
  # Empty = Gemini picks freely from all 26 formulas.
  preferred_hook_formulas: []
carousel: { size: "1080x1350", slides: "5-7" }
cta: "Follow @codexonebyhitesh for daily dev content"
hashtags:
  [
    "#coding",
    "#programming",
    "#systemdesign",
    "#dsa",
    "#ai",
    "#developer",
    "#softwareengineer",
    "#techindia",
  ]
